name: Cache Warmup

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces keep file/line without the variable-level debug info that
  # dominates target/ size and codegen time; local builds stay untouched.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Incremental artifacts are the largest recompilation byproduct and are never
  # cached; disabling them keeps target/ inside the runner's root disk.
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Linking every test binary beside the cache's zstd staging exhausts the
      # runner: a full disk or an out-of-memory linker both surface as a Bus
      # error. Reclaim the preinstalled bundles and docker images, and add swap
      # on the larger /mnt disk so the linker keeps virtual-memory headroom.
      - name: Free runner disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/lib/google-cloud-sdk
          sudo apt-get clean
          sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name node \
            -exec rm -rf {} + 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null
          sudo swapon /mnt/swapfile
          echo "--- disk ---"; df -h /; echo "--- memory ---"; free -h

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@v0.0.5
        with:
          components: rustfmt clippy

      # Same cache family as the PR QA job. Branch caches are not shared
      # between PRs; caches saved from main are — this is what keeps PR runs
      # warm.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@v0.0.5
        with:
          prefix: qa-1
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      # The exact PR QA surface with tests built but not executed: warms the
      # clippy check artifacts, the dependency tree, the build scripts (incl.
      # the web-demo npm vendoring) and the test binaries — and doubles as a
      # post-merge verification of main.
      - name: Lint and warm build
        uses: gronke/rust-ci/.github/actions/lint-and-test@v0.0.5
        with:
          test-args: --no-run

      # The save half: prune target/ to dependency artifacts, upload under
      # the restore's key — the entry every PR restores from.
      - name: Save the pruned target
        uses: gronke/rust-ci/.github/actions/rust-cache-save@v0.0.5

  # Warms the wasm-1 cache family the PR wasm job restores from.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@v0.0.5
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@v0.0.5
        with:
          prefix: wasm-1
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      - name: Warm the wasm lint
        run: cargo clippy -p uic_tui_web -p uic_dom --target wasm32-unknown-unknown -- -D warnings

      # The save half: prune target/ to dependency artifacts, upload under
      # the restore's key — the entry every PR restores from.
      - name: Save the pruned target
        uses: gronke/rust-ci/.github/actions/rust-cache-save@v0.0.5
