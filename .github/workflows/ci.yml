name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces keep file/line without the variable-level debug info that
  # dominates target/ size and codegen time; local builds stay untouched.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Incremental artifacts are the largest recompilation byproduct and are never
  # cached; disabling them keeps target/ inside the runner's root disk.
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Linking every test binary beside the cache's zstd staging exhausts the
      # runner: a full disk or an out-of-memory linker both surface as a Bus
      # error. Reclaim the preinstalled bundles and docker images, put the
      # build tree on the larger /mnt disk (lld mmaps its output, so a disk
      # filling mid-link kills it with SIGBUS instead of ENOSPC) and add swap
      # on the root disk, which sits idle once the build tree moved away.
      - name: Free runner disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/lib/google-cloud-sdk
          sudo apt-get clean
          sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name node \
            -exec rm -rf {} + 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          # The image ships an active 4G /swapfile; replace it with 10G.
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          sudo mkdir -p /mnt/target
          sudo chown "$(id -u):$(id -g)" /mnt/target
          ln -s /mnt/target target
          echo "--- disk ---"; df -h / /mnt; echo "--- memory ---"; free -h

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@v0.0.5
        with:
          components: rustfmt clippy

      # Pure consumer: restore the registry and target the warmup saves from
      # main; PR-scoped saves would only duplicate them out of reach.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@v0.0.5
        with:
          prefix: qa-1
          save: "false"
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      # fmt · clippy -D warnings · test, the shared org QA policy, over the
      # full feature universe (dist/json/testing are feature-gated).
      # Building uic_web_demo vendors the npm dependencies (network access).
      - name: Lint and test
        uses: gronke/rust-ci/.github/actions/lint-and-test@v0.0.5
        with:
          features: "--all-features"

      # The workspace test binaries have run and nothing later reads them:
      # parity replays staged fixtures from the source tree, and the dist
      # step links fresh feature-hashed binaries. Deleting them returns
      # their gigabytes to the scratch disk right before the dist links,
      # the job's fullest moment, where a heavy-delta PR can still brush
      # the disk into an ld SIGBUS.
      - name: Reclaim the run test binaries
        run: |
          find target/debug/deps target/debug/examples target/debug \
            -maxdepth 1 -type f -executable -delete 2>/dev/null || true
          echo "--- disk ---"; df -h / /mnt

      # The dist suite hides behind its required-features gate.
      # The dist test binaries each statically link the whole oxc/grass codegen
      # stack; linking two of them at once peaks the runner into an ld Bus error,
      # so this step links one binary at a time.
      - name: Dist build test
        run: cargo test -p uic_codegen_web --features dist --jobs 1

      # The workspace run staged the compiled twin and the Rust fixtures;
      # node replays them, the cross-target parity gate.
      - name: Cross-target parity
        run: node scripts/parity-check.mjs

      # The forensic tail: how full both disks ended, pass or fail.
      - name: Disk report
        if: always()
        run: df -h / /mnt

  # The TUI stack keeps compiling for the browser; this is what the crossterm
  # mirror pin exists for.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@v0.0.5
        with:
          targets: wasm32-unknown-unknown

      # Pure consumer: restore the registry and target the warmup saves from
      # main; PR-scoped saves would only duplicate them out of reach.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@v0.0.5
        with:
          prefix: wasm-1
          save: "false"
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      - name: Lint the browser TUI on wasm
        run: cargo clippy -p uic_tui_web -p uic_dom --target wasm32-unknown-unknown -- -D warnings

      # The shippable artifact must actually build: the wasm profile plus
      # wasm-bindgen glue (the script pins the CLI to the locked version).
      - name: Build the browser TUI bundle
        run: ./scripts/build-wasm.sh
