name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@main
        with:
          components: rustfmt clippy

      # Same cache family the warmup saves from main, so PRs start warm.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@main
        with:
          prefix: qa-1
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      # fmt · clippy -D warnings · test, the shared org QA policy.
      # Building uic_web_demo vendors the npm dependencies (network access).
      - name: Lint and test
        uses: gronke/rust-ci/.github/actions/lint-and-test@main

  # The TUI stack keeps compiling for the browser; this is what the crossterm
  # mirror pin exists for.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@main
        with:
          targets: wasm32-unknown-unknown

      # Same cache family the warmup saves from main, so PRs start warm.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@main
        with:
          prefix: wasm-1
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      - name: Lint the browser TUI on wasm
        run: cargo clippy -p uic_tui_web -p uic_dom --target wasm32-unknown-unknown -- -D warnings
