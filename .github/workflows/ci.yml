name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces keep file/line without the variable-level debug info that
  # dominates target/ size and codegen time; local builds stay untouched.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The native target with every test binary, plus the cache's zstd
      # staging, no longer fits beside the runner's preinstalled bundles.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@v0.0.5
        with:
          components: rustfmt clippy

      # Pure consumer: restore the registry and target the warmup saves from
      # main; PR-scoped saves would only duplicate them out of reach.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@v0.0.5
        with:
          prefix: qa-1
          save: "false"
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      # fmt · clippy -D warnings · test, the shared org QA policy, over the
      # full feature universe (dist/json/testing are feature-gated).
      # Building uic_web_demo vendors the npm dependencies (network access).
      - name: Lint and test
        uses: gronke/rust-ci/.github/actions/lint-and-test@v0.0.5
        with:
          features: "--all-features"

      # The dist suite hides behind its required-features gate.
      - name: Dist build test
        run: cargo test -p uic_codegen_web --features dist

      # The workspace run staged the compiled twin and the Rust fixtures;
      # node replays them — the cross-target parity gate.
      - name: Cross-target parity
        run: node scripts/parity-check.mjs

  # The TUI stack keeps compiling for the browser; this is what the crossterm
  # mirror pin exists for.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@v0.0.5
        with:
          targets: wasm32-unknown-unknown

      # Pure consumer: restore the registry and target the warmup saves from
      # main; PR-scoped saves would only duplicate them out of reach.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@v0.0.5
        with:
          prefix: wasm-1
          save: "false"
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      - name: Lint the browser TUI on wasm
        run: cargo clippy -p uic_tui_web -p uic_dom --target wasm32-unknown-unknown -- -D warnings

      # The shippable artifact must actually build: the wasm profile plus
      # wasm-bindgen glue (the script pins the CLI to the locked version).
      - name: Build the browser TUI bundle
        run: ./scripts/build-wasm.sh
