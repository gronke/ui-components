name: Dist branch

# Publishes the built npm tree (cargo run -p uic_dist) to a `dist` branch and an
# immutable `dist-v<version>` tag in this repo, so consumers can git-vendor the
# components without an npm registry while the publish decision stays open
# (ADR 0004). The `dist` branch is a force-pushed pointer to the latest build;
# the `dist-v<version>` tag is written once and left immutable for pinning.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  dist-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@v1.4.2

      # Same cache family the warmup saves from main, so releases start warm.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@v1.4.2
        with:
          prefix: qa-1
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      - name: Build the npm tree
        run: cargo run -p uic_dist

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version dist/npm/package.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      - name: Publish the dist branch and tag
        run: |
          version=$(jq -r .version dist/npm/package.json)
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cd dist/npm
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b dist
          git add -A
          git commit -qm "dist v${version} (${GITHUB_SHA})"
          # A force-pushed pointer to the latest built package.
          git push --force "$remote" dist
          # An immutable per-version tag; write it once, never move it (a moved
          # tag is a cache hit for consumers pinning it, so they'd keep stale JS).
          if git ls-remote --exit-code --tags "$remote" "dist-v${version}" >/dev/null 2>&1; then
            echo "dist-v${version} already published — leaving the immutable tag"
          else
            git tag "dist-v${version}"
            git push "$remote" "dist-v${version}"
          fi
