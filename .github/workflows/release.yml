name: Release

# A manual rehearsal of the npm publish against the current main. The real
# `npm publish` stays gated off until the registry decision lands (ADR 0004);
# flipping it on needs the NPM_TOKEN secret. Release-time distribution — the
# tarball attached to a published GitHub Release — lives in release-asset.yml,
# so this no longer runs on tag pushes.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  npm-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: gronke/rust-ci/.github/actions/install-toolchain@v1.4.2

      # Same cache family the warmup saves from main, so releases start warm.
      - name: Rust cache
        uses: gronke/rust-ci/.github/actions/rust-cache@v1.4.2
        with:
          prefix: qa-1
          cache-target: "true"
          lockfiles: "**/Cargo.toml"

      - name: Build the npm tree
        run: cargo run -p uic_dist

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version dist/npm/package.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      - name: Set up npm
        uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org

      - name: Publish rehearsal (dry run)
        run: npm publish --dry-run
        working-directory: dist/npm

      # The real publish, once the registry decision lands:
      # - name: Publish
      #   if: startsWith(github.ref, 'refs/tags/')
      #   run: npm publish
      #   working-directory: dist/npm
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
