[workspace]
resolver = "2"
members = [
    "crates/uic_template",
    "crates/uic_core",
    "crates/uic_dom",
    "crates/uic_css",
    "crates/uic_macros",
    "crates/uic_codegen_web",
    "crates/uic_tui",
    "crates/uic_tui_web",
    "crates/uic_worker",
    "crates/uic_js",
    "crates/uic_sync",
    "crates/ui_components",
    "apps/web-demo",
    "apps/tui-demo",
    "apps/lit-demo",
    "apps/dist",
]

[workspace.package]
version = "0.1.0"
authors = ["Stefan Grönke <stefan@gronke.net>"]
license = "MIT"
edition = "2021"
# MSRV matches web_modules, which tracks oxc.
rust-version = "1.95"

[workspace.dependencies]
# workspace crates
uic_template = { path = "crates/uic_template", version = "0.1.0" }
uic_core = { path = "crates/uic_core", version = "0.1.0" }
uic_dom = { path = "crates/uic_dom", version = "0.1.0" }
uic_css = { path = "crates/uic_css", version = "0.1.0" }
uic_macros = { path = "crates/uic_macros", version = "0.1.0" }
uic_codegen_web = { path = "crates/uic_codegen_web", version = "0.1.0" }
uic_tui = { path = "crates/uic_tui", version = "0.1.0" }
uic_tui_web = { path = "crates/uic_tui_web", version = "0.1.0" }
uic_worker = { path = "crates/uic_worker", version = "0.1.0" }
uic_js = { path = "crates/uic_js", version = "0.1.0" }
uic_sync = { path = "crates/uic_sync", version = "0.1.0" }
ui_components = { path = "crates/ui_components", version = "0.1.0" }

# shared external dependencies
inventory = "0.3"
thiserror = "2"
html5ever = "0.39"
indextree = "4.8"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
trybuild = "1"
chrono = "0.4"
chrono-tz = "0.10"
genco = "0.19"
dprint-plugin-typescript = "0.96"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
taffy = "0.12"
rat-widget = "=3.2.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
include_dir = "0.7"
wasm-bindgen = "0.2"
js-sys = "0.3"
# One version for every consumer; the [patch.crates-io] pins stay authoritative
# for the source. Features differ per crate, so members enable their own.
web_modules = { version = "0.5.1", default-features = false }
npm-utils = "0.6.1"
# The same 0.8 line as web_modules, so routers compose across the boundary.
axum = "0.8"
# Renders the live mode's join URL as terminal half-blocks; the default
# features would pull in the image stack.
qrcode = { version = "0.14", default-features = false }

# The browser TUI build (scripts/build-wasm.sh). One codegen unit per crate:
# wasm-ld extracts archive members lazily, and the element registry's
# inventory constructors survive only when they share their object file with
# the `link()` the session calls.
[profile.wasm]
inherits = "release"
codegen-units = 1

# 0.5.1 plus the dev-server fix rendering live .tera with the embedded
# fallback's import map; drop the pin with the next web_modules release.
[patch.crates-io]
web_modules = { git = "https://github.com/gronke/web_modules", rev = "2f9e4d90ba0fc12411cd7698a52d7df5de86908e" }
# The manifest field transforms (set_field/remove_field) merged upstream
# ahead of a release; drop the pin with the 0.6.2 release.
npm-utils = { git = "https://github.com/gronke/npm-utils", rev = "b0ed4fded875e97064163ab621b6c2321e6142bb" }
# Upstream master plus neutral cfg(not(any(unix, windows))) stubs so the TUI
# stack compiles to wasm — the branch behind crossterm-rs/crossterm#1066;
# re-pin if that PR rebases, drop when a release carrying it reaches
# ratatui-crossterm and the rat crates.
crossterm = { git = "https://github.com/gronke/fork-crossterm", rev = "119bc826a1afbaf358cf6695b581cf8946b48839" }
