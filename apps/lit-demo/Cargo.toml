[package]
name = "uic_lit_demo"
description = "One hand-written Lit todo app: the terminal runs it on uic_js/Boa, the browser gets it served via web_modules"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# storage backs the runtime's localStorage (the --backend flag), dialogs
# the mocked alert/confirm/prompt the loop paints as overlays.
uic_js = { workspace = true, features = ["storage", "sqlite", "dialogs", "clipboard"] }
uic_dom.workspace = true
clap.workspace = true
# The crossterm/ratatui re-exports drive the terminal loop and paint; the
# qr feature carries the native QR widget and its half-block renderer.
uic_tui = { workspace = true, features = ["qr"] }
# default-features = true is load-bearing: the workspace pins web_modules
# with default-features = false, and the dev server needs the defaults
# (tera, builder) back to render live pages.
web_modules = { workspace = true, default-features = true, features = ["dev"] }
# The live mode's WebSocket state bridge rides the frontend router.
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["sync"] }
serde_json.workspace = true
include_dir.workspace = true
# The p2p mode: a native WebRTC peer speaking the compact payloads (ADR
# 0028) — the codec rides uic_sync.
uic_sync.workspace = true
webrtc.workspace = true
# The p2p clipboard watch auto-continues a pairing step when a matching
# credential appears; --no-clipboard and headless sessions leave it inert.
arboard.workspace = true

[build-dependencies]
# Build-time baking: the app's TypeScript compiles into the npm tree and
# the browser dist; Tera renders the page with the importmap hole.
web_modules = { workspace = true, features = ["typescript", "tera"] }
# Compiles the app's TypeScript into its npm tree.
uic_npm.workspace = true
serde_json.workspace = true
# The sync tooling bakes its npm tree beside the app's.
uic_sync.workspace = true
