[package]
name = "uic_web_demo"
description = "Browser demo: generated ui-components served via web_modules"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
# `dev` pulls the axum integration (Frontend factory + serve) and the dev server.
# The two dependency kinds enable different feature sets over the one
# workspace version; the server side keeps the default stack plus dev.
web_modules = { workspace = true, default-features = true, features = ["dev"] }
tokio.workspace = true
# include_dir's macro must be used from a direct dependency; same 0.7 line as
# web_modules, so the `Dir` types unify.
include_dir.workspace = true

[build-dependencies]
# Build-time baking needs the compilers + Tera — no axum/tokio.
web_modules = { workspace = true, features = ["typescript", "scss", "tera"] }
# The component catalog and its TypeScript generator run inside this script.
ui_components.workspace = true
uic_codegen_web.workspace = true
# The registry feeds the example manifest (notify pairs, option properties).
uic_core.workspace = true
# The worker host's TypeScript sources join the build as an extra root.
uic_worker.workspace = true
serde_json.workspace = true
