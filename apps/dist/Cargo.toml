[package]
name = "uic_dist"
description = "Builds the npm-distributable web components tree"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ui_components.workspace = true
# The icon component's impl imports the generated ICON_SVGS map; the dist must
# emit it too, or `<uic-icon>`/`<input-secret>` load a dangling `./uic-icons.js`.
uic_icons.workspace = true
uic_codegen_web = { workspace = true, features = ["dist"] }
uic_worker.workspace = true
uic_sync.workspace = true
