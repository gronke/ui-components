[package]
name = "uic_worker"
description = "The browser worker host for foreign lit elements: the worker, its page client, and the npm tree they publish as"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Compiles the TypeScript sources into the publish-ready npm tree.
uic_npm.workspace = true
# Builds the tree's exports and description into the TreeSpec.
serde_json.workspace = true
# Compiles the mocked-lit runtime (uic_js's js/src) into the served worker tree.
web_modules = { workspace = true, features = ["typescript"] }
