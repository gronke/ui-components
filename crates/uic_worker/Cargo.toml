[package]
name = "uic_worker"
description = "The browser worker host for foreign lit elements: the worker, its page client, and the npm tree they publish as"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Compiles the TypeScript sources for the npm tree; consumers hand the
# source root to their own web_modules build instead.
web_modules = { workspace = true, features = ["typescript"] }
# Assembles the npm tree's package.json (package_json::manifest).
npm-utils.workspace = true
serde_json.workspace = true
