[package]
name = "ui_components"
description = "The component catalog: one Rust definition per custom element"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
uic_core.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uic_tui = { workspace = true, optional = true }

[features]
# The co-located TUI widget twins (ADR 0002). TUI consumers enable it;
# web-only consumers (codegen build scripts, the npm tree) stay lean.
tui = ["dep:uic_tui"]

[dev-dependencies]
# The component unit tests replay the runtime's update cycle.
uic_core = { workspace = true, features = ["testing"] }
