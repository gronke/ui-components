<input type="password"
  class="form-control text-start w-100 font-monospace"
  data-tui="secret-input"
  data-qa="secret-input"
  .value=${value}
  ?readonly=${!editable}
  ?disabled=${disabled}
  @change=${on_change} />
<!-- The reveal and copy buttons are browser-only chrome — the terminal twin
     (data-tui="secret-input") draws its own reveal. `hidden` keeps them, and the
     dual-target <uic-icon> glyphs inside, out of the terminal; `updated` in
     secret.impl.ts un-hides them in the browser. The glyphs swap by name. -->
<button type="button" class="btn btn-outline-secondary" data-qa="secret-reveal" aria-label="Reveal" aria-pressed="false" hidden>
  <uic-icon data-qa="secret-reveal-icon" name="visibility"></uic-icon>
</button>
<button type="button" class="btn btn-outline-secondary" data-qa="secret-copy" aria-label="Copy to clipboard" hidden>
  <uic-icon data-qa="secret-copy-icon" name="content_copy"></uic-icon>
</button>
