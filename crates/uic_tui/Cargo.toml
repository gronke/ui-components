[package]
name = "uic_tui"
description = "Terminal runtime for ui-components: ratatui + taffy + rat-widget"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4"
crossterm = "0.29"
rat-widget = "=3.2.1"
ratatui = "0.30"
taffy = "0.12"
thiserror = "2"
uic_core.workspace = true
uic_css.workspace = true
uic_dom.workspace = true
uic_template.workspace = true
unicode-width = "0.2"

[dev-dependencies]
# With the tui feature: the integration tests mount components whose widget
# twins live in the catalog (ADR 0015).
ui_components = { workspace = true, features = ["tui"] }
