[package]
name = "uic_tui"
description = "Terminal runtime for ui-components: ratatui + taffy + rat-widget"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
crossterm.workspace = true
qrcode = { workspace = true, optional = true }
rat-widget.workspace = true
ratatui.workspace = true
taffy.workspace = true
thiserror.workspace = true
uic_core.workspace = true
uic_css.workspace = true
uic_dom.workspace = true
uic_template.workspace = true
unicode-width = "0.2"

[features]
# The native QR widget (`data-tui="qr"`) and its half-block renderer; off
# for the wasm terminal, so the browser bundle carries no encoder.
qr = ["dep:qrcode"]

[dev-dependencies]
# With the tui feature: the integration tests mount components whose widget
# twins live in the catalog (ADR 0002).
ui_components = { workspace = true, features = ["tui"] }

[[test]]
name = "qr_registry"
required-features = ["qr"]
