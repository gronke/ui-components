[package]
name = "uic_tui_web"
description = "Browser host for the terminal runtime: wasm sessions rendered through xterm.js"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# rlib: a reusable, catalog-agnostic host library. The browser wasm entry is a
# consumer cdylib (apps/web-demo-tui) that binds this host to its catalog.
crate-type = ["rlib"]

[dependencies]
uic_core = { workspace = true, features = ["json"] }
uic_tui.workspace = true
ratatui.workspace = true
crossterm.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The ansi suite mounts catalog components (the input widgets, app-root); the
# host itself is catalog-agnostic — the consumer links them.
ui_components_tui.workspace = true
ui_components_demo.workspace = true
