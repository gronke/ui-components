[package]
name = "uic_js"
description = "A Boa-embedded JS engine hosting real LitElement components on the terminal runtime"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# localStorage on the mocked DOM: the sync StorageBackend seam, the
# in-memory default and the __uic_storage_* natives. Off by default —
# consumers opt into the global.
storage = []
# The file-backed backend: a location selected by the app survives
# restarts. Implies storage.
sqlite = ["storage", "dep:rusqlite"]

[dependencies]
boa_engine = "0.21"
rusqlite = { workspace = true, optional = true }
# load_package derives a vendored package's ESM entry from its manifest.
serde_json.workspace = true
thiserror.workspace = true
uic_core.workspace = true
uic_dom.workspace = true
uic_tui.workspace = true

[build-dependencies]
# Vendors the npm packages declared in package.json (pinned via the
# workspace patch); the manifest also drives the offline presence checks.
serde_json.workspace = true
web_modules = { workspace = true, default-features = true }

[dev-dependencies]
# The browser session example: an axum WebSocket bridges xterm.js to a
# native session rendered by uic_tui_web's ANSI backend; the third_party
# example vendors arbitrary packages at runtime.
axum = { version = "0.8", features = ["ws"] }
tokio.workspace = true
uic_tui_web.workspace = true
web_modules = { workspace = true, default-features = true }

[[test]]
name = "storage"
required-features = ["storage"]
