[package]
name = "ui_components_tui"
description = "The catalog's terminal widget twins: the tui.rs adapters, path-mirrored beside ui_components"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
uic_core.workspace = true
uic_tui.workspace = true
# The twins back this catalog's definitions; link() chains its registrations.
ui_components.workspace = true
# The <uic-icon> twin rasterizes the shared SVGs to Braille cells.
uic_icons = { workspace = true, features = ["raster"] }
