[package]
name = "uic_codegen_web"
description = "Emits TypeScript/SCSS web components (Lit variant) from ui-components definitions"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# The npm-distributable build: compiled ESM + .d.ts + css via web_modules.
dist = ["dep:web_modules"]

[dependencies]
uic_core.workspace = true
uic_template.workspace = true
thiserror.workspace = true
serde_json.workspace = true
web_modules = { workspace = true, features = ["typescript", "dts", "scss"], optional = true }

[dev-dependencies]
# Registers <input-date>/<input-text> in the test binary's registry.
ui_components.workspace = true
# The demo composition <app-root> the generate/parity/dist tests exercise.
ui_components_demo.workspace = true
# oxc smoke test: the emitted TypeScript must transpile.
web_modules = { workspace = true, features = ["typescript"] }
# The parity fixtures convert states through the shared JSON layer.
uic_core = { workspace = true, features = ["json"] }

[[test]]
name = "dist"
required-features = ["dist"]
